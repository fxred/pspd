apiVersion: apps/v1
kind: Deployment
metadata:
  name: ruby-gateway-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ruby-gateway
  template:
    metadata:
      labels:
        app: ruby-gateway
    spec:
      containers:
      - name: ruby-gateway-container
        image: ruby-gateway:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8082 
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: ruby-gateway-service
spec:
  type: NodePort
  selector:
    app: ruby-gateway
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082